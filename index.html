<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live weather dashboard with current weather, humidity, and wind speed.">
  <title>SkyCast — Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-mark" aria-hidden="true">☀</div>
      <div>
        <p class="eyebrow">YOUR WEATHER, AT A GLANCE</p>
        <h1>SkyCast</h1>
      </div>
    </header>

    <section class="search-panel" aria-label="Search weather by city">
      <label for="cityInput">Find a city</label>
      <form id="searchForm" class="search-form">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="cityInput" type="text" placeholder="Enter city name, e.g. Delhi" maxlength="100" autocomplete="off" required>
        <button id="searchButton" type="submit">Search</button>
      </form>
      <p class="hint">Try a city anywhere in the world.</p>
    </section>

    <p id="statusMessage" class="status" role="status" aria-live="polite">Loading weather…</p>

    <section id="weatherPanel" class="weather-panel" hidden aria-label="Current weather">
      <div class="weather-top">
        <div>
          <p class="eyebrow">CURRENT WEATHER</p>
          <h2 id="cityName">—</h2>
          <p id="localTime" class="local-time"></p>
        </div>
        <div id="weatherIcon" class="weather-icon" aria-hidden="true">☀️</div>
      </div>

      <div class="temperature-row">
        <p id="temperature" class="temperature">—°</p>
        <div class="condition-block">
          <p id="condition" class="condition">—</p>
          <p id="feelsLike" class="feels-like">Feels like —°C</p>
        </div>
      </div>

      <div class="metrics">
        <article class="metric-card">
          <span class="metric-icon" aria-hidden="true">💧</span>
          <p class="metric-label">Humidity</p>
          <p id="humidity" class="metric-value">—%</p>
        </article>
        <article class="metric-card">
          <span class="metric-icon" aria-hidden="true">🌬️</span>
          <p class="metric-label">Wind speed</p>
          <p id="windSpeed" class="metric-value">— km/h</p>
        </article>
        <article class="metric-card">
          <span class="metric-icon" aria-hidden="true">🌡️</span>
          <p class="metric-label">Pressure</p>
          <p id="pressure" class="metric-value">— hPa</p>
        </article>
      </div>
      <p class="updated">Live conditions · Updated <span id="updatedAt">just now</span></p>
    </section>

    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · No API key required</footer>
  </main>
</body>
</html>
